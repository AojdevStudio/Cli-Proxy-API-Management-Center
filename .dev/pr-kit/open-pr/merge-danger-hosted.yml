name: merge-danger

# Scores every same-repo PR's merge danger the same way, whoever wrote it, and posts the
# `merge-danger` commit status on the exact head. land-pr reads that status at merge time.
# pull_request_target runs this workflow and score.ts from the default branch, so a PR cannot
# change its own score. This copy runs on a GitHub-hosted runner, for a public repo that may not
# use the homelab runners. The job reads Jev's key from the repo Actions secret TYPESAFE_API_KEY,
# through the score step's env only (ROLLOUT.md, step 4b), and holds a token that writes
# statuses. So it checks out the default branch only and reads the PR through the event payload
# and the API. Never check out or run the PR's code here.
on:
  pull_request_target:
    types: [opened, edited, reopened, synchronize, ready_for_review]

permissions:
  contents: read
  statuses: write

concurrency:
  group: merge-danger-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  score:
    name: Merge danger
    # Fork and Dependabot PRs skip this check, so no fork PR reaches the secret.
    if: >-
      github.actor != 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'dependabot[bot]'
    # A standard GitHub-hosted runner, free for a public repo.
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
        env:
          HOME: ${{ runner.temp }}/setup-bun
      - run: bun .claude/skills/open-pr/score.ts --event "$GITHUB_EVENT_PATH"
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
